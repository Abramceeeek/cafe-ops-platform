name: hub_app
description: HubSync Hub App for Specialists and Couriers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  printing: ^5.12.0
  pdf: ^3.10.8
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  shared_constants:
    path: ../../packages/shared_constants
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../../assets/brand/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "../../assets/brand/app_icon.jpg"

flutter:
  uses-material-design: true
