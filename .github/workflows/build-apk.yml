name: build-apk

# Builds installable debug APKs for the two Flutter apps in CI (the runners have
# Flutter + the Android SDK — no local toolchain needed). Download the APK from
# the run's Artifacts and sideload it on a phone. Supabase creds are passed at
# build time via --dart-define from repo secrets SUPABASE_URL / SUPABASE_ANON_KEY
# (add them under Settings → Secrets → Actions; the anon key is public-safe).
# Firebase/push is not wired yet — a debug APK installs without it.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop_app, hub_app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android platform files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=android --org com.hubsync .
      - name: Configure Firebase (Android)
        working-directory: apps/${{ matrix.app }}
        run: |
          SHORT="${{ matrix.app }}"; SHORT="${SHORT%_app}"
          OLD="com.hubsync.${{ matrix.app }}"
          NEW="com.hubsync.${SHORT}"
          echo "Pinning applicationId $OLD -> $NEW (to match google-services.json)"
          sed -i "/applicationId/ s/${OLD}/${NEW}/" android/app/build.gradle.kts
          cp ../../firebase/google-services.json android/app/google-services.json
          sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          echo "=== settings.gradle.kts plugins ==="; sed -n '/^plugins/,/}/p' android/settings.gradle.kts
          echo "=== app build.gradle.kts plugins ==="; sed -n '/^plugins/,/}/p' android/app/build.gradle.kts
          echo "=== applicationId ==="; grep applicationId android/app/build.gradle.kts
      - name: Force plugin compileSdk (printing/pdf need >= 34)
        working-directory: apps/${{ matrix.app }}
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          // Some plugins (e.g. printing) hardcode an older compileSdk than their
          // androidx deps require (34+). Force every not-yet-evaluated plugin
          // module to 35. Skip already-evaluated projects (e.g. :app, pre-evaluated
          // by Flutter's evaluationDependsOn) to avoid afterEvaluate errors.
          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      project.extensions.findByName("android")?.let { ext ->
                          try {
                              ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 35)
                          } catch (e: Exception) {}
                      }
                  }
              }
          }
          EOF
      - name: Generate launcher icons (brand logo)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
