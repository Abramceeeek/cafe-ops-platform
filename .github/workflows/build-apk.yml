name: build-apk

# Builds installable debug APKs for the two Flutter apps in CI (the runners have
# Flutter + the Android SDK — no local toolchain needed). Download the APK from
# the run's Artifacts and sideload it on a phone. Supabase creds are passed at
# build time via --dart-define from repo secrets SUPABASE_URL / SUPABASE_ANON_KEY
# (add them under Settings → Secrets → Actions; the anon key is public-safe).
# Firebase/push is not wired yet — a debug APK installs without it.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop_app, hub_app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android platform files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=android --org com.hubsync .
      - name: Configure Firebase (Android)
        working-directory: apps/${{ matrix.app }}
        run: |
          SHORT="${{ matrix.app }}"; SHORT="${SHORT%_app}"
          OLD="com.hubsync.${{ matrix.app }}"
          NEW="com.hubsync.${SHORT}"
          echo "Pinning applicationId $OLD -> $NEW (to match google-services.json)"
          sed -i "/applicationId/ s/${OLD}/${NEW}/" android/app/build.gradle
          cp ../../firebase/google-services.json android/app/google-services.json
          sed -i '/id "com.android.application" version/a\        id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          echo "=== settings.gradle plugins ==="; sed -n '/^plugins/,/}/p' android/settings.gradle
          echo "=== app build.gradle plugins ==="; sed -n '/^plugins/,/}/p' android/app/build.gradle
          echo "=== applicationId ==="; grep applicationId android/app/build.gradle
      - name: Generate launcher icons (brand logo)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
