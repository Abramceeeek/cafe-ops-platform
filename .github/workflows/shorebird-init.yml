name: shorebird-init

# ONE-OFF (removed after it runs): registers both apps with Shorebird — which needs
# the SHOREBIRD_TOKEN API key, so it runs here rather than on a laptop — and commits
# shorebird.yaml, the pubspec asset entry and a pinned pubspec.lock back to the
# branch. Pinned lockfiles matter: a patch must build against exactly the plugin
# versions of the release it patches.
on:
  push:
    branches: [feat/shorebird-android]

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Register apps + pin lockfiles
        run: |
          set -e
          shorebird --version
          SB_ROOT=$(dirname "$(dirname "$(command -v shorebird)")")
          SB_FLUTTER="$SB_ROOT/bin/cache/flutter/$(cat "$SB_ROOT/bin/internal/flutter.version")/bin/flutter"
          "$SB_FLUTTER" --version
          for app in shop_app hub_app; do
            if [ -f "apps/$app/shorebird.yaml" ]; then echo "$app already initialised"; continue; fi
            if [ "$app" = shop_app ]; then NAME="HubSync Shop"; else NAME="HubSync Hub"; fi
            (
              cd "apps/$app"
              "$SB_FLUTTER" create --platforms=ios,android --org com.hubsync .
              "$SB_FLUTTER" pub get
              shorebird init --display-name "$NAME"
            )
          done
          git status --short -- apps/shop_app apps/hub_app | grep -v -E '/(android|ios)/' || true
      - name: Commit registration back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/shop_app/shorebird.yaml apps/hub_app/shorebird.yaml \
                  apps/shop_app/pubspec.yaml apps/hub_app/pubspec.yaml \
                  apps/shop_app/pubspec.lock apps/hub_app/pubspec.lock
          git diff --cached --stat
          git commit -m "chore(shorebird): register shop + hub apps, pin pubspec.lock"
          git push
