name: build-ios

# Verifies the two Flutter apps compile for iOS on a macOS runner (free for
# public repos). Builds UNSIGNED — proves the code is iOS-ready WITHOUT needing
# an Apple Developer account. Once the account + signing certs exist, this is
# extended to produce a signed .ipa + upload to TestFlight (see docs/IOS_SETUP.md).
on:
  workflow_dispatch:
  push:
    branches: [ci/ios-build]

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop_app, hub_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use CocoaPods (disable Swift Package Manager)
        run: flutter config --no-enable-swift-package-manager
      - name: Generate iOS platform files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=ios --org com.hubsync .
      - name: Configure iOS (bundle id + write Podfile)
        working-directory: apps/${{ matrix.app }}
        run: |
          SHORT="${{ matrix.app }}"; SHORT="${SHORT%_app}"
          NEW="com.hubsync.${SHORT}"
          echo "Setting bundle id -> $NEW"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${NEW};/g" ios/Runner.xcodeproj/project.pbxproj
          # flutter create does not reliably emit a Podfile — write the standard one
          # (iOS 13 for Firebase 15.x). flutter build respects an existing Podfile.
          cat > ios/Podfile <<'PODFILE'
          platform :ios, '13.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "Generated.xcconfig must exist. Run flutter pub get first."
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found. Run flutter pub get first."
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
            end
          end
          PODFILE
          echo "=== Podfile written ==="; head -3 ios/Podfile
      - name: Build iOS (unsigned — verifies the code compiles)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Result
        run: echo "✅ ${{ matrix.app }} compiles for iOS (unsigned). Signing + TestFlight need the Apple account."
