name: build-ios

# Verifies the two Flutter apps compile for iOS on a macOS runner (free for
# public repos). Builds UNSIGNED — proves the code is iOS-ready WITHOUT needing
# an Apple Developer account. Once the account + signing certs exist, this is
# extended to produce a signed .ipa + upload to TestFlight (see docs/IOS_SETUP.md).
on:
  workflow_dispatch:
  push:
    branches: [ci/ios-build]

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop_app, hub_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=ios --org com.hubsync .
      - name: Configure iOS (bundle id + deployment target)
        working-directory: apps/${{ matrix.app }}
        run: |
          SHORT="${{ matrix.app }}"; SHORT="${SHORT%_app}"
          NEW="com.hubsync.${SHORT}"
          echo "Setting bundle id -> $NEW"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${NEW};/g" ios/Runner.xcodeproj/project.pbxproj
          # Firebase 15.x needs iOS 13+. Set on the Xcode project (covers the SPM path,
          # e.g. shop_app) and on the Podfile when one exists (CocoaPods path, hub_app).
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g" ios/Runner.xcodeproj/project.pbxproj
          if [ -f ios/Podfile ]; then sed -i '' "s/^# *platform :ios.*/platform :ios, '13.0'/" ios/Podfile; fi
          # Firebase iOS config (per app, committed under /firebase like google-services.json).
          # firebase_core reads it at runtime; for a SIGNED build it must also be added to the
          # Runner target in Xcode (docs/IOS_SETUP.md). The unsigned compile check below
          # doesn't require it, but we stage it so the signed-build extension is one step away.
          cp "../../firebase/GoogleService-Info-${SHORT}.plist" ios/Runner/GoogleService-Info.plist
      - name: Build iOS (unsigned — verifies the code compiles)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Result
        run: echo "✅ ${{ matrix.app }} compiles for iOS (unsigned). Signing + TestFlight need the Apple account."
