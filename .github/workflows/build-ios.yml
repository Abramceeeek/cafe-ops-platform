name: build-ios

# Verifies the two Flutter apps compile for iOS on a macOS runner (free for
# public repos). Builds UNSIGNED — proves the code is iOS-ready WITHOUT needing
# an Apple Developer account. Once the account + signing certs exist, this is
# extended to produce a signed .ipa + upload to TestFlight (see docs/IOS_SETUP.md).
on:
  workflow_dispatch:
  push:
    branches: [ci/ios-build]

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shop_app, hub_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform files
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=ios --org com.hubsync .
      - name: Configure iOS (bundle id, iOS 13, Firebase modular-header fix)
        working-directory: apps/${{ matrix.app }}
        run: |
          SHORT="${{ matrix.app }}"; SHORT="${SHORT%_app}"
          NEW="com.hubsync.${SHORT}"
          echo "Setting bundle id -> $NEW"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${NEW};/g" ios/Runner.xcodeproj/project.pbxproj
          # Firebase pods need iOS 13+ (flutter create comments the platform line out).
          sed -i '' "s/^# *platform :ios.*/platform :ios, '13.0'/" ios/Podfile || true
          grep -q "platform :ios" ios/Podfile || printf "platform :ios, '13.0'\n%s" "$(cat ios/Podfile)" > ios/Podfile
          # Fix the firebase_messaging non-modular Firebase.h error two ways:
          # (a) build all pods as clang modules, (b) allow non-modular includes.
          perl -0pi -e "s/(target 'Runner' do)/\$1\n  use_modular_headers!/" ios/Podfile
          perl -0pi -e 's/(flutter_additional_ios_build_settings\(target\))/$1\n    target.build_configurations.each do |bc|\n      bc.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"\n    end/' ios/Podfile
          echo "=== Podfile target ==="; sed -n "/target 'Runner'/,/^end/p" ios/Podfile | head -6
          echo "=== Podfile platform ==="; grep "platform :ios" ios/Podfile
          echo "=== Podfile post_install ==="; sed -n '/post_install/,/^end/p' ios/Podfile
      - name: Build iOS (unsigned — verifies the code compiles)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Result
        run: echo "✅ ${{ matrix.app }} compiles for iOS (unsigned). Signing + TestFlight need the Apple account."
