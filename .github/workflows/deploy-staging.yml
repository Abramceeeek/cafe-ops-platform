name: Deploy Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      # No-op until the staging Supabase project + secrets exist (ROADMAP 0.2).
      - name: Guard — skip when secrets unset
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}" ]; then
            echo "Supabase staging secrets not configured — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest
      - name: Push migrations + deploy Edge Functions
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
          supabase db push
          supabase functions deploy
